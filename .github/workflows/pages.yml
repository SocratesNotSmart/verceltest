# Keeps the `gh-pages` branch in sync with `main`, which is what GitHub Pages
# serves. This deliberately avoids the Pages REST API: the workflow token is not
# allowed to create a Pages site on this repository, but it can push a branch,
# and a branch is all Pages needs once the source is set to gh-pages.
#
# There is no build step — the repo root is the site.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the published tree
        run: |
          rm -rf .github
          touch .nojekyll

      - name: Force-push it to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-build
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA:0:7}"
          git push --force origin gh-pages-build:gh-pages
